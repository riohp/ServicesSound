version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  simple:
    format: "%(levelname)s - %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: logs/servicessound.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8

loggers:
  ServicesSoundAlexa:
    level: DEBUG
    handlers:
      - console
      - file
    propagate: false

root:
  level: WARNING
  handlers:
    - console
